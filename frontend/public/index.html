<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title>Trip For P</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Pretendard Variable", sans-serif;
        list-style: none;
      }
      /* 스크롤바 스타일링 */
      ::-webkit-scrollbar {
        width: 8px;  /* 스크롤바 너비 */
      }

      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);  /* 스크롤바 트랙 배경색 */
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.2);  /* 스크롤바 썸네일 색상 */
        border-radius: 4px;
        transition: background 0.3s ease;  /* 호버 효과 부드럽게 */
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.3);  /* 호버시 더 진한 색상 */
      }
      #app {
        display: flex;
        flex-direction: column;
        position: relative;
        align-items: center;
        overflow-x: hidden;
      }

      a {
        color: inherit; /* 부모 요소의 색상을 상속 */
        text-decoration: none; /* 밑줄 제거 */
        cursor: pointer; /* 마우스 오버 시 포인터 커서 유지 */
      }

      /* 모든 상태에서 동일한 스타일 유지 */
      a:hover,
      a:visited,
      a:active,
      a:focus {
        color: inherit;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
